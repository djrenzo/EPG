name: Update EPG
on:
  schedule:
    - cron: '0 5,17 * * *'   # runs at 05:00 and 17:00 UTC daily
  workflow_dispatch:           # lets you trigger it manually too
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Clone iptv-org/epg
        run: git clone --depth 1 -b master https://github.com/iptv-org/epg.git
      - name: Install dependencies
        run: |
          cd epg
          npm install
      - name: Copy channels file
        run: cp channels.xml epg/channels.xml
      - name: Grab EPG
        run: |
          cd epg
          npm run grab --- --channels=channels.xml --output=../guide.xml --days=7
      - name: Fix image tags for Kodi
        run: |
          sed -i 's|<image>\(.*\)</image>|<icon src="\1"/>|g' guide.xml
      - name: Install image processing deps
        run: npm install sharp --no-save
      - name: Downsize and localize EPG images
        run: node scripts/process-images.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Commit and push guide.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guide.xml images/
          git diff --cached --quiet || git commit -m "Update guide.xml [skip ci]"
          git push
